# Impostazioni comuni a tutte le linee Plone.
# Incluso da plone60.cfg / plone61.cfg / plone62.cfg (e quindi anche dall'alias versions.cfg).

[iocomune]
version = __CURRENT_VERSION__

#[config]
#maxupload = 120MB

# workaround per https://github.com/plone/Products.CMFPlone/issues/3848
#[instance-settings]
#zope-conf-additional =
#  <dos_protection>
#    form-memory-limit ${config:maxupload}
#  </dos_protection>

[versions]
# security
py = 1.11.0
# fix di sicurezza di Pillow 12.1.1, 12.2.0, 12.3.0 e 13.0.0; richiede Python >= 3.11
# https://pillow.readthedocs.io/en/stable/releasenotes/13.0.0.html
Pillow = 13.0.0
# lxml >= 6.1.0 (GHSA-vfmq-68hx-4jfw): stessi valori della release 6.2.3, riportati su 6.0 e 6.1
# (erano a 5.4.0 / 0.4.4); lxml-html-clean 0.4.6 richiede lxml >= 6.1.1
lxml = 6.1.3
lxml-html-clean = 0.4.6
# con lxml 6 il parsing di un documento vuoto restituisce None: repoze.xmliter 1.0 va in
# AttributeError (es. diazo test_content_empty), la 2.0 alza XMLSyntaxError come con lxml 5.
# Stesso valore della release 6.2.3. Dalla 2.0 usa il namespace nativo PEP 420.
repoze.xmliter = 2.0
# ReDoS / DoS nei selettori CSS (GHSA-6655-6qjp-jx7x, GHSA-mmhr-3c5m-f64f, GHSA-7g44-g9rc-x53w,
# GHSA-4j63-6c4x-wfg4); dalla 3.0 richiede Python >= 3.11.5
soupsieve = 4.1.1
