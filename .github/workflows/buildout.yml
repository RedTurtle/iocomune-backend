name: Run development buildout

permissions:
  contents: read

on:
  push:
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    name: Lint versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: No duplicated pins across the shared files
        run: |
          dups=$(grep -hoE '^[A-Za-z0-9._-]+[[:space:]]*=' versions/*.cfg \
                 | tr -d ' =' | tr 'A-Z' 'a-z' | sort | uniq -d)
          test -z "$dups" || { echo "pin duplicati in versions/: $dups"; exit 1; }

  build:
    name: Buildout Plone ${{ matrix.plone }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: "60"
            plone: "6.0.15"
            # XXX: solo sulla 6.0, per https://github.com/pypa/setuptools/pull/4856/files
            extra_pins: "setuptools==75.8.2 zc.buildout==4.1.10"
          - line: "61"
            plone: "6.1.5"
            extra_pins: ""
            experimental: true
          - line: "62"
            plone: "6.2.1"
            extra_pins: ""
            experimental: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Set locale
        run: |
          sudo locale-gen en_US
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Check that the line files agree on the Plone version
        run: |
          got=$(grep -hoE '6\.[0-9]+\.[0-9]+' \
                  plone${{ matrix.line }}.cfg \
                  requirements${{ matrix.line }}.txt \
                  development${{ matrix.line }}.cfg | sort -u)
          test "$got" = "${{ matrix.plone }}"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements${{ matrix.line }}.txt
          if [ -n "${{ matrix.extra_pins }}" ]; then pip install ${{ matrix.extra_pins }}; fi
      - name: Build
        run: |
          buildout -c development${{ matrix.line }}.cfg -t 2
      - name: c.r.plonesite
        run: |
          echo "from plone import api; print(api.portal.get().getId())" | bin/instance -OPlone debug
      - name: Test
        run: |
          bin/test -u
