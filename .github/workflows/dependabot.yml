name: Create requirements.txt for dependabot

# Nelle PR i file generati vengono solo VERIFICATI: se sono obsoleti il job fallisce e
# commenta la PR. Non committiamo piu' nelle PR perche' un commit fatto con GITHUB_TOKEN
# non ri-triggera i workflow: l'head della PR restava senza i check veri e la PR sembrava
# verde anche con la CI rossa. La rigenerazione con commit avviene solo su push a main.
#
# La generazione passa sempre dai target del Makefile ("make generated-update" e i due
# singoli), che girano in un container: stesso identico comando in locale e qui.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: requirements-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: requirements.txt
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      - name: Restore generator cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: generator-${{ hashFiles('Makefile', 'docker/Dockerfile.generator', 'requirements*.txt', 'plone6*.cfg', 'docker/constraints*.cfg') }}
          restore-keys: generator-
      - name: Regenerate requirements
        run: make dependabot-update
      - name: Check that the committed files are up to date
        id: check
        run: |
          if git diff --quiet -- dependabot; then
            echo "i file generati sono aggiornati"
            exit 0
          fi
          {
            echo 'diff<<PATCH_EOF'
            git diff -- dependabot | head -200
            echo 'PATCH_EOF'
          } >> "$GITHUB_OUTPUT"
          exit 1
      - name: Comment on the PR
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PATCH: ${{ steps.check.outputs.diff }}
        run: |
          {
            echo "<!-- generated-files-check -->"
            echo "### I file generati non sono aggiornati"
            echo
            echo 'Rigenerali e committali (serve solo docker):'
            echo
            echo '```bash'
            echo 'make generated-update'
            echo '```'
            echo
            echo "Rigenera sia \`dependabot/\` sia \`sbom/\`: qui sotto sono elencate solo le"
            echo "differenze sui requirements, ma vanno aggiornati entrambi."
            echo
            echo "<details><summary>Differenze rilevate</summary>"
            echo
            echo '```diff'
            echo "$PATCH"
            echo '```'
            echo
            echo "</details>"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none

  generate:
    name: Regenerate and commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Restore generator cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: generator-${{ hashFiles('Makefile', 'docker/Dockerfile.generator', 'requirements*.txt', 'plone6*.cfg', 'docker/constraints*.cfg') }}
          restore-keys: generator-
      - name: Build requirements.txt
        run: make dependabot-update
      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain dependabot)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Build SBOM
        if: steps.git-check.outputs.changed == 'true'
        run: make sbom-update
      - name: Commit and push changes
        run: |
          git config --global user.email "info@redturtle.it"
          git config --global user.name "RedTurtle CI BOT"
          git add dependabot sbom
          git commit -m "Auto-generate file at $(date)" || exit 0
          git pull --rebase "https://${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/main"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
