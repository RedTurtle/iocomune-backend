name: Build development image

on:
  pull_request:
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-image:
    name: Build docker image Plone ${{ matrix.line }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # la linea di default riceve anche il tag senza suffisso, per compatibilità
        include:
          - line: "60"
            default: true
          - line: "61"
          - line: "62"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get the image id
        run: |
          IMAGE_ID=$(echo ghcr.io/${{ github.repository }} | tr '[A-Z]' '[a-z]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Extract branch name
        shell: bash
        run: echo "IMAGE_BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_ENV"

      - name: Resolve Plone version and tags
        run: |
          # la versione Plone si legge dal cfg della linea: unica fonte di verità
          PV=$(grep -oE 'dist\.plone\.org/release/[0-9.]+/versions\.cfg' plone${{ matrix.line }}.cfg \
               | head -1 | cut -d/ -f3)
          echo "PLONE_VERSION=$PV" >> "$GITHUB_ENV"
          TAGS="$IMAGE_ID:${IMAGE_BRANCH}_development-plone${{ matrix.line }}"
          if [ "${{ matrix.default }}" = "true" ]; then
            TAGS="$TAGS,$IMAGE_ID:${IMAGE_BRANCH}_development"
          fi
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"

      - name: Build and push container image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile.development
          push: true
          build-args: |
            PLONE_VERSION=${{ env.PLONE_VERSION }}
            PLONE_LINE=${{ matrix.line }}
          tags: ${{ env.TAGS }}
          platforms: linux/amd64,linux/arm64
