# Entry point delle versioni per la linea Plone 6.2.
# Le regole di manutenzione sono documentate in plone60.cfg.
#
# ATTENZIONE: linea sperimentale. I prodotti design.plone.* / redturtle.volto /
# collective.volto.* non sono ancora validati con plone.restapi 10 e
# plone.app.contenttypes 5, quindi in CI è marcata "experimental".

[buildout]
extends =
# 1. pin della release Plone (precedenza più bassa)
    https://dist.plone.org/release/6.2.1/versions.cfg
    https://dist.plone.org/release/6.2.1/versions-ecosystem.cfg
    https://dist.plone.org/release/6.2.1/versions-extra.cfg
# 2. pin condivisi, indipendenti dalla linea Plone (si modificano una volta sola)
    versions/base.cfg
    versions/iocomune.cfg
    versions/iocittadino.cfg
    versions/iosegnalo.cfg
    versions/ioprenoto.cfg
    versions/infra.cfg
# 3. unpin per ultimi, così battono i pin della release
    versions/unpin.cfg

[plone]
# solo informativo: non si può usare in "extends"
version = 6.2.1
line = 62

[versions]
# --- pin specifici della linea 6.2 ---
# 1.81.0 è quanto richiede robotframework-browser in buildout.coredev 6.2
grpcio-tools = 1.81.0
# 1.0.0b10 fallisce con Zope 6.x (AssertionError in monkey.py, vedi infra.cfg)
# in futuro la 1.1.x può essere messa a fattor comune
experimental.noacquisition = 1.1.0b0
