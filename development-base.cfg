
#
# THIS IS FOR DEVELOPMENT, DO NOT USE AS IS IN PRODUCTION
#
# !!!
# !!! ogni volta che si esegue il buildout, la recipe 'site' fa tutti gli upgrade
# !!! step del portale e dei prodotti aggiuntivi, questo è comodo per lo sviluppo
# !!! ma non per staging e produzione
# !!!
#
# Parti comuni a tutte le linee Plone: non estende nulla e non contiene [versions]
# (i pin stanno in versions/*.cfg e plone6X.cfg). Usare development60.cfg /
# development61.cfg / development62.cfg, che lo includono nell'ordine corretto.

[buildout]
extends = versions/test.cfg
parts +=
    site
    omelette
allow-picked-versions = false
# XXX: se si aggiungono i test di design.* si rompono quelli di plone, in particolare
#      plone.portlets e plone.app.portlets. rimuoverli col -= del buildout non funziona
#      perché restano comunque nel working-set (dipendenze transitive di altri egg),
#      quindi il test runner continua a scoprirne i test: li si esclude invece a livello
#      di test runner, in [test], con un filtro di modulo negato (-m '!...')
test-eggs +=
    design.plone.policy[test]
    design.plone.contenttypes[test]
    design.plone.iocittadino[test]
    design.plone.ioprenoto[test]

[test]
defaults +=
    + ['-m', '!plone\.(app\.)?portlets']

[instance]
eggs +=
    collective.upgrade
    design.plone.policy
    design.plone.contenttypes
# relstorage qui non è usato ma viene testata comunque il recupero degli egg
# TODO: l'immagine ha dei prerequisti (libpsql, python-dev, ... per ora lasciamo senza)
#    relstorage[postgresql]

[site]
recipe = collective.recipe.plonesite
site-id = Plone
default-language = it
profiles-initial =
    plone.app.caching:default
    design.plone.policy:default
upgrade-portal = true
upgrade-all-profiles = true

[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}
