# Buildout di sviluppo per la linea Plone 6.1, basato su buildout.coredev 6.1.5.
#
# Ordine degli extends vincolante:
#  - coredev per primo, così i "parts +=" / "eggs +=" di development-base.cfg si
#    accumulano sui valori di coredev;
#  - plone61.cfg per ultimo, così i nostri pin battono quelli di coredev (stesso
#    comportamento del percorso docker).

[buildout]
extends =
    https://raw.githubusercontent.com/plone/buildout.coredev/6.1.5/buildout.cfg
    development-base.cfg
    plone61.cfg
