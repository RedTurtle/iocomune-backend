# Entry point delle versioni per la linea Plone 6.0.
#
# Regole per manutenerlo:
#  - un pin sta in versions/*.cfg SOLO se vale identico su tutte le linee Plone;
#    se una linea richiede un valore diverso, va nella [versions] di questo file;
#  - negli "extends" non funziona la sostituzione ${sezione:chiave}: la versione Plone
#    va scritta letteralmente (per questo esiste un file per linea);
#  - per togliere un pin si usa "pkg =" (vuoto); "-=" non funziona sulle versioni.

[buildout]
extends =
# 1. pin della release Plone (precedenza più bassa)
    https://dist.plone.org/release/6.0.16/versions.cfg
    https://dist.plone.org/release/6.0.16/versions-ecosystem.cfg
    https://dist.plone.org/release/6.0.16/versions-extra.cfg
# 2. pin condivisi, indipendenti dalla linea Plone (si modificano una volta sola)
    versions/base.cfg
    versions/iocomune.cfg
    versions/iocittadino.cfg
    versions/iosegnalo.cfg
    versions/ioprenoto.cfg
    versions/infra.cfg
# 3. unpin per ultimi, così battono i pin della release
    versions/unpin.cfg

[plone]
# solo informativo: non si può usare in "extends"
version = 6.0.16
line = 60

[versions]
# --- security fix backportati sulla 6.0 ---
RestrictedPython = 8.5
h11 = 0.16.0
# --- pin specifici della linea 6.0 (sulle linee successive vince la release) ---
grpcio-tools = 1.70.0
psutil = 5.9.5
collective.z3cform.datagridfield = 3.0.1
plone.recipe.zeoserver = 2.0.3
zope.mkzeoinstance = 5.0
# questo poi va a morire quando dismettiamo i 6.0
zope.sendmail = 7.3

# I 6.0 sono quasi tutti con python 3.11.2 quindi < del requisito (3.11.5) voluto da soupsieve 4.x
# Da togliere questa personalizzazione quando si aggiorneranno i python in produzione
soupsieve = 3.0.1

# lxml è stato aggiornato con la 6.0.16 e deve avere la stessa vesione di libxml2 di xmlsec
xmlsec = 1.3.18
# dm.plone.advancedquery 1.0 importa string_types da Products.ExtendedPathIndex, rimosso nella 5.0.0 (arrivata con Plone 6.0.16)
# Teniamo la versione di Plone 6.0.15 perché tanto poi sulla 6.2 dobbiamo comunque riscrivere/sostituire il prodotto dm.plone.advancedquery (che non è più compatibile con Plone 6.2)
Products.ExtendedPathIndex = 4.0.1
