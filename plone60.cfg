# Entry point delle versioni per la linea Plone 6.0.
#
# Regole per manutenerlo:
#  - un pin sta in versions/*.cfg SOLO se vale identico su tutte le linee Plone;
#    se una linea richiede un valore diverso, va nella [versions] di questo file;
#  - negli "extends" non funziona la sostituzione ${sezione:chiave}: la versione Plone
#    va scritta letteralmente (per questo esiste un file per linea);
#  - per togliere un pin si usa "pkg =" (vuoto); "-=" non funziona sulle versioni.

[buildout]
extends =
# 1. pin della release Plone (precedenza più bassa)
    https://dist.plone.org/release/6.0.15/versions.cfg
    https://dist.plone.org/release/6.0.15/versions-ecosystem.cfg
    https://dist.plone.org/release/6.0.15/versions-extra.cfg
# 2. pin condivisi, indipendenti dalla linea Plone (si modificano una volta sola)
    versions/base.cfg
    versions/iocomune.cfg
    versions/iocittadino.cfg
    versions/iosegnalo.cfg
    versions/ioprenoto.cfg
    versions/infra.cfg
# 3. unpin per ultimi, così battono i pin della release
    versions/unpin.cfg

[plone]
# solo informativo: non si può usare in "extends"
version = 6.0.15
line = 60

[versions]
# --- security fix backportati sulla 6.0 ---
# https://community.plone.org/t/security-vulnerability-announcement-plone-app-textfield-and-plone-restapi/23050
plone.app.textfield = 2.0.2
plone.restapi = 9.15.6
# https://community.plone.org/t/plone-security-fixes-20260623/23085
plone.app.contenttypes = 3.0.12
plone.app.dexterity = 3.2.3
plone.app.event = 5.2.4
plone.app.portlets = 5.0.8
RestrictedPython = 8.3
h11 = 0.16.0

# --- pin specifici della linea 6.0 (sulle linee successive vince la release) ---
Products.isurlinportal = 2.1.0
grpcio-tools = 1.70.0
click = 8.1.8
psutil = 5.9.5
collective.z3cform.datagridfield = 3.0.1
plone.recipe.zeoserver = 2.0.3
zope.mkzeoinstance = 5.0
