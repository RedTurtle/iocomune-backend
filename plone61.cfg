# Entry point delle versioni per la linea Plone 6.1.
# Le regole di manutenzione sono documentate in plone60.cfg.

[buildout]
extends =
# 1. pin della release Plone (precedenza più bassa)
    https://dist.plone.org/release/6.1.5/versions.cfg
    https://dist.plone.org/release/6.1.5/versions-ecosystem.cfg
    https://dist.plone.org/release/6.1.5/versions-extra.cfg
# 2. pin condivisi, indipendenti dalla linea Plone (si modificano una volta sola)
    versions/base.cfg
    versions/iocomune.cfg
    versions/iocittadino.cfg
    versions/iosegnalo.cfg
    versions/ioprenoto.cfg
    versions/infra.cfg
# 3. unpin per ultimi, così battono i pin della release
    versions/unpin.cfg

[plone]
# solo informativo: non si può usare in "extends"
version = 6.1.5
line = 61

[versions]
# --- pin specifici della linea 6.1 ---
# i security fix backportati sulla 6.0 qui arrivano già dalla release
grpcio-tools = 1.75.1
# https://community.plone.org/t/plone-security-fixes-20260831/23193
plone.autoform=2.0.5
plone.restapi=9.15.7
